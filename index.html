<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>

  <section>
    <div class="login-card">

      <!-- <h1>Welcome Back</h1> -->
      <p>Sign in to your workspace</p>
      <form action="html/home.html">

        <div>
          <label for="email">EMAIL</label>
          <input type="email" name="email" placeholder="example@gmail.com" required>
        </div>

        <div>
          <label for="password">PASSWORD</label>
          <input type="password" name="password" placeholder="Enter Your Password" minlength="8" required>
        </div>

        <button type="submit">Sign in</button>
      </form>

    </div>
  </section>

</body>

</html>
