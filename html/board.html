<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board</title>
  <link rel="stylesheet" href="../css/board.css" />
  <script src="../js/navbar.js" defer></script>
  <script src="../js/board.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

  <header class="navbar">
    <div class="navigations">
      <nav>
        <a href="home.html">Home</a>
        <a href="backlog.html">Backlog</a>
        <a href="board.html" class="active">Board</a>
      </nav>
    </div>

    <div class="nav_right"></div>
  </header>

  <main>

    <div class="board">

      <div class="col" data-status="todo">
        <h2>To Do <span>0</span></h2>
      </div>

      <div class="col" data-status="progress">
        <h2>In Progress <span>0</span></h2>
      </div>

      <div class="col" data-status="review">
        <h2>In Review <span>0</span></h2>
      </div>

      <div class="col" data-status="done">
        <h2>Done <span>0</span></h2>
      </div>

    </div>

  </main>

</body>

</html>
