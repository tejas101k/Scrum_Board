<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backlog</title>
  <link rel="stylesheet" href="../css/backlog.css" />
  <script src="../js/navbar.js" defer></script>
  <script src="../js/backlog.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>

  <header class="navbar">
    <div class="navigations">
      <nav>
        <a href="home.html">Home</a>
        <a href="backlog.html" class="active">Backlog</a>
        <a href="board.html">Board</a>
      </nav>
    </div>

    <div class="nav_right"></div>
  </header>

  <main>

    <div class="backlog-header">
      <details class="new-item">
        <summary>+ New sprint</summary>
        <form>
          <div class="form-group">
            <label>Sprint Name</label>
            <input type="text" placeholder="Sprint name" required>
          </div>
          <div class="form-row">
            <div class="form-group flex-1">
              <label>Start Date</label>
              <input type="date" required>
            </div>
            <div class="form-group flex-1">
              <label>End Date</label>
              <input type="date" required>
            </div>
          </div>
          <div class="form-group">
            <label>Goal (optional)</label>
            <textarea placeholder="Goal (optional)" rows="2"></textarea>
          </div>
          <button type="submit">Create sprint</button>
        </form>
      </details>

      <details class="new-item">
        <summary>+ New issue</summary>
        <form>
          <div class="form-group">
            <label>Title</label>
            <input type="text" placeholder="Issue title" required>
          </div>

          <div class="form-group">
            <label>Description (optional)</label>
            <textarea placeholder="Description (optional)" rows="2"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group flex-1">
              <label>Type</label>
              <select name="type">
                <option value="task">Task</option>
                <option value="bug">Bug</option>
                <option value="story">Story</option>
              </select>
            </div>

            <div class="form-group flex-1">
              <label>Sprint</label>
              <select name="sprint">
                <option value="" selected>Backlog (unscheduled)</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group flex-1">
              <label>Priority</label>
              <select name="priority">
                <option value="Low">Low</option>
                <option value="Normal">Normal</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
            </div>

            <div class="form-group flex-1">
              <label>Assignee</label>
              <select name="assignee">
                <option value="" selected>Unassigned</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group flex-1">
              <label>State</label>
              <select name="status">
                <option value="todo" selected>To Do</option>
                <option value="progress">In Progress</option>
                <option value="review">Review</option>
                <option value="done">Done</option>
              </select>
            </div>

            <div class="form-group flex-1">
              <label>Story Points</label>
              <input type="number" placeholder="Story points" min="0" step="1">
            </div>
          </div>

          <button type="submit">Create issue</button>
        </form>
      </details>
    </div>

    <div class="legend">
      <span><i data-type="task">T</i>Task</span>
      <span><i data-type="bug">B</i>Bug</span>
      <span><i data-type="story">S</i>Story</span>
    </div>

    <details class="sprint" open>
      <summary>
        <span class="no">–</span>
        <div>
          <h2>Backlog</h2>
          <p>Not yet scheduled</p>
        </div>
        <span class="count">0 issues</span>
      </summary>

      <ul>
      </ul>
    </details>

  </main>

</body>

</html>
